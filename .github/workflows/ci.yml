name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  inventory-service:
    name: inventory-service (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: inventory-service/go.sum
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race ./...

  gateway-service:
    name: gateway-service (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gateway-service/package-lock.json
      - run: npm ci
      - name: syntax check
        run: for f in *.js; do node --check "$f"; done

  order-service:
    name: order-service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: import + compile check
        run: python -m compileall -q .

  lua-scripts:
    name: redis lua scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: syntax-check every .lua
        run: find . -name '*.lua' -print -exec luac5.4 -p {} \;

  compose:
    name: docker-compose validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
